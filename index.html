<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhatNow</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #080808;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      text-align: center;
      padding: 24px;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 12px;
    }

    p {
      color: #999;
      margin-bottom: 24px;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 14px 22px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>WhatNow</h1>
    <p>Tell us what you're feeling. We'll figure out what to do.</p>

    <button onclick="alert('WhatNow is alive.')">
      Get Started
    </button>
  </div>

</html>
