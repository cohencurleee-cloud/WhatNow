<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08080c">
<title>WhatNow</title>
<style>
:root{--bg:#08080c;--panel:#15151d;--panel2:#1d1d27;--text:#f7f7fb;--muted:#9b9baa;--line:rgba(255,255,255,.09);--a:#8b5cf6;--b:#ec4899;--good:#43d17c}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif}body{background:radial-gradient(circle at 10% 0%,rgba(139,92,246,.2),transparent 30%),radial-gradient(circle at 100% 20%,rgba(236,72,153,.13),transparent 28%),var(--bg)}button,input,textarea{font:inherit;color:inherit}.app{width:min(100%,900px);margin:auto;padding:16px 16px 100px}.top{display:flex;justify-content:space-between;align-items:center;padding:8px 0 20px}.brand{font-size:20px;font-weight:900}.status{font-size:12px;color:var(--muted);font-weight:800}.hero{padding:22px 0 12px}h1{font-size:clamp(42px,11vw,80px);line-height:.94;letter-spacing:-4px;margin:0;font-weight:950}.grad{background:linear-gradient(120deg,#fff,#c7b9ff,#ff9bd3);-webkit-background-clip:text;color:transparent}.sub{color:var(--muted);font-weight:600;line-height:1.5;font-size:17px;max-width:650px}.composer{margin-top:22px;border:1px solid var(--line);background:rgba(21,21,29,.86);backdrop-filter:blur(18px);border-radius:26px;padding:12px;box-shadow:0 24px 80px rgba(0,0,0,.35)}textarea{width:100%;min-height:100px;border:0;outline:0;resize:none;background:transparent;padding:10px;font-size:18px}.row{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}.left{display:flex;gap:8px}.btn{border:1px solid var(--line);background:var(--panel2);border-radius:14px;padding:11px 14px;font-weight:850;cursor:pointer}.go{border:0;background:linear-gradient(135deg,var(--a),var(--b));padding:12px 18px;border-radius:14px;font-weight:900;cursor:pointer}.go:disabled{opacity:.55}.chips{display:flex;gap:8px;overflow:auto;padding:15px 0}.chip{white-space:nowrap;border:1px solid var(--line);background:rgba(21,21,29,.8);border-radius:999px;padding:9px 12px;color:var(--muted);font-weight:800;cursor:pointer}.section{margin-top:30px}.section h2{font-size:23px;margin:0}.small{color:var(--muted);font-size:13px;font-weight:650;margin-top:5px}.grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:14px}.card{border:1px solid var(--line);background:rgba(21,21,29,.88);border-radius:22px;padding:17px}.card h3{margin:3px 0 8px;font-size:22px}.meta{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.pill{font-size:11px;font-weight:900;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 8px}.addr{color:var(--muted);font-size:14px;line-height:1.4}.actions{display:flex;gap:8px;margin-top:15px}.actions a,.actions button{flex:1;text-decoration:none;text-align:center;border-radius:13px;padding:11px 10px;font-weight:900;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer}.actions .primary{border:0;background:linear-gradient(135deg,var(--a),var(--b))}.notice{border:1px dashed var(--line);border-radius:18px;padding:20px;color:var(--muted);font-weight:700;text-align:center;margin-top:14px}.filters{display:none;margin-top:12px;border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:15px}.filters.show{display:block}.field{margin:10px 0}.field label{display:flex;justify-content:space-between;font-weight:850;font-size:13px;margin-bottom:7px}.field input{width:100%}.locbtn{border:1px solid var(--line);background:var(--panel);border-radius:13px;padding:10px 12px;font-weight:850;cursor:pointer}.green{color:var(--good)}@media(min-width:720px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<main class="app">
<header class="top"><div class="brand">● WhatNow</div><div><button class="locbtn" id="locBtn">Use my location</button></div></header>
<section class="hero">
<h1>Stop thinking.<br><span class="grad">Go somewhere.</span></h1>
<p class="sub">Type what you want to do. WhatNow finds real places around your GPS location and refuses to show anything past your distance limit.</p>
<div class="composer">
<textarea id="q" placeholder="pizza, bowling, arcade, park, coffee, thrift store..."></textarea>
<div class="row"><div class="left"><button class="btn" id="filterBtn">Filters</button><button class="btn" id="surprise">Surprise me</button></div><button class="go" id="go">Find it</button></div>
<div class="filters" id="filters">
<div class="field"><label>Maximum distance <span id="distLabel">10 miles</span></label><input id="distance" type="range" min="1" max="50" value="10"></div>
<div class="field"><label>Maximum results <span id="countLabel">12</span></label><input id="count" type="range" min="4" max="30" value="12"></div>
</div>
</div>
<div class="chips"><button class="chip" data-q="restaurants">Food</button><button class="chip" data-q="coffee">Coffee</button><button class="chip" data-q="bowling">Bowling</button><button class="chip" data-q="arcade">Arcade</button><button class="chip" data-q="park">Parks</button><button class="chip" data-q="movie theater">Movies</button><button class="chip" data-q="thrift store">Thrift</button></div>
</section>
<section class="section" id="resultsSection" style="display:none"><h2 id="title">Nearby</h2><div class="small" id="sub"></div><div class="grid" id="grid"></div></section>
</main>
<script>
const $=id=>document.getElementById(id);let coords=null;const state={distance:10,count:12};
const categoryRules=[
{keys:["pizza"],label:"pizza places",q:'nwr["amenity"="restaurant"]["cuisine"~"pizza",i]'},
{keys:["restaurant","restaurants","food","eat","dinner","lunch","hungry"],label:"restaurants",q:'nwr["amenity"="restaurant"]'},
{keys:["coffee","cafe","café"],label:"coffee shops",q:'nwr["amenity"="cafe"]'},
{keys:["bowling"],label:"bowling alleys",q:'nwr["leisure"="bowling_alley"]'},
{keys:["arcade","games"],label:"arcades",q:'nwr["leisure"="amusement_arcade"]'},
{keys:["park","parks","outside","walk"],label:"parks",q:'nwr["leisure"="park"]'},
{keys:["movie","movies","cinema","theater","theatre"],label:"movie theaters",q:'nwr["amenity"="cinema"]'},
{keys:["thrift","second hand","secondhand"],label:"thrift stores",q:'nwr["shop"="second_hand"]'},
{keys:["museum","museums"],label:"museums",q:'nwr["tourism"="museum"]'},
{keys:["library","libraries"],label:"libraries",q:'nwr["amenity"="library"]'},
{keys:["gym","workout","fitness"],label:"gyms",q:'nwr["leisure"="fitness_centre"]'},
{keys:["ice cream","dessert"],label:"dessert spots",q:'nwr["amenity"~"cafe|ice_cream"]'},
{keys:["mall","shopping"],label:"shopping",q:'nwr["shop"]'},
{keys:["bar","bars","drinks"],label:"bars",q:'nwr["amenity"="bar"]'}];
function miles(lat1,lon1,lat2,lon2){const R=3958.8,dLat=(lat2-lat1)*Math.PI/180,dLon=(lon2-lon1)*Math.PI/180,a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(a))}
function pickRule(text){const t=text.toLowerCase();return categoryRules.find(r=>r.keys.some(k=>t.includes(k)))||{label:"fun places",q:'nwr["name"]["leisure"]'}}
function getCoords(el){if(el.type==="node")return[el.lat,el.lon];if(el.center)return[el.center.lat,el.center.lon];return[null,null]}
function addr(t){return [t["addr:housenumber"],t["addr:street"],t["addr:city"]].filter(Boolean).join(" ").replace(/ (\d+) /," $1 ")||t["addr:full"]||"Address not listed"}
async function locate(force=false){if(coords&&!force)return coords;if(!navigator.geolocation)throw new Error("This browser does not support location.");$("locBtn").textContent="Locating…";return new Promise((resolve,reject)=>navigator.geolocation.getCurrentPosition(p=>{coords={lat:p.coords.latitude,lng:p.coords.longitude};$("locBtn").textContent="Location on";$("locBtn").classList.add("green");resolve(coords)},e=>{coords=null;$("locBtn").textContent="Use my location";reject(new Error(e.code===1?"Location permission was denied. Allow location in Safari settings.":"Could not get your location."))},{enableHighAccuracy:true,timeout:12000,maximumAge:120000}))}
async function searchPlaces(text){const c=await locate(false),rule=pickRule(text),radius=Math.round(state.distance*1609.344),query=`[out:json][timeout:20];(${rule.q}(around:${radius},${c.lat},${c.lng}););out center tags;`;const endpoints=["https://overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter"];let data=null,lastErr;for(const ep of endpoints){try{const r=await fetch(ep,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},body:"data="+encodeURIComponent(query)});if(!r.ok)throw new Error("Search service error");data=await r.json();break}catch(e){lastErr=e}}if(!data)throw lastErr||new Error("Place search failed");let places=data.elements.map(el=>{const [lat,lng]=getCoords(el);if(!Number.isFinite(lat)||!Number.isFinite(lng))return null;const d=miles(c.lat,c.lng,lat,lng),t=el.tags||{};return{id:`${el.type}-${el.id}`,name:t.name||t.brand||t.operator||"Unnamed place",lat,lng,d,type:t.amenity||t.leisure||t.shop||t.tourism||"place",address:addr(t)}}).filter(Boolean).filter(p=>p.d<=state.distance).filter(p=>p.name!=="Unnamed place");const seen=new Set();places=places.filter(p=>{const k=p.name.toLowerCase()+"|"+p.lat.toFixed(4)+"|"+p.lng.toFixed(4);if(seen.has(k))return false;seen.add(k);return true}).sort((a,b)=>a.d-b.d).slice(0,state.count);return{places,label:rule.label}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function directions(p){return`https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}`}
function render(list){const g=$("grid");if(!list.length){g.innerHTML='<div class="notice">Nothing matched inside your distance limit. Try a broader search or increase the mileage.</div>';return}g.innerHTML=list.map(p=>`<article class="card"><div class="meta"><span class="pill">${p.d.toFixed(1)} mi away</span><span class="pill">${esc(p.type.replaceAll("_"," "))}</span></div><h3>${esc(p.name)}</h3><div class="addr">${esc(p.address)}</div><div class="actions"><a class="primary" target="_blank" rel="noopener" href="${directions(p)}">Directions</a><button onclick="navigator.share?navigator.share({title:'${esc(p.name)}',text:'${esc(p.name)}',url:'${directions(p)}'}):navigator.clipboard.writeText('${directions(p)}')">Share</button></div></article>`).join("")}
async function run(text){text=(text||"").trim()||"fun places";$("resultsSection").style.display="block";$("title").textContent="Searching nearby…";$("sub").textContent=`Hard limit: ${state.distance} miles.`;$("grid").innerHTML='<div class="notice">Using your GPS and checking real places…</div>';$("go").disabled=true;try{const r=await searchPlaces(text);$("title").textContent=r.places.length?`Closest ${r.label}`:`No ${r.label} found`;$("sub").textContent=r.places.length?`${r.places.length} real places, closest first. Nothing shown is farther than ${state.distance} miles.`:`Nothing matched within ${state.distance} miles.`;render(r.places)}catch(e){$("title").textContent="Search failed";$("sub").textContent=e.message;$("grid").innerHTML='<div class="notice">'+esc(e.message)+'</div>'}finally{$("go").disabled=false;$("resultsSection").scrollIntoView({behavior:"smooth",block:"start"})}}
$("go").onclick=()=>run($("q").value);$("q").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();run($("q").value)}});$("locBtn").onclick=()=>locate(true).catch(e=>alert(e.message));$("filterBtn").onclick=()=>$("filters").classList.toggle("show");$("distance").oninput=e=>{state.distance=Number(e.target.value);$("distLabel").textContent=state.distance+" miles"};$("count").oninput=e=>{state.count=Number(e.target.value);$("countLabel").textContent=state.count};document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{$("q").value=b.dataset.q;run(b.dataset.q)});$("surprise").onclick=()=>{const x=["restaurants","coffee","bowling","arcade","park","movie theater","thrift store","museum"];const q=x[Math.floor(Math.random()*x.length)];$("q").value=q;run(q)};
</script>
</body>
</html>
